<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yakala Daveti</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#f9fafb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#1f2937;padding:32px;border-radius:20px;text-align:center;max-width:340px;margin:16px}
h1{color:#f59e0b}
button{background:#f59e0b;border:none;color:#fff;font-size:1.1rem;padding:14px 22px;border-radius:12px;margin-top:16px;cursor:pointer}
p{opacity:.85;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>⚡ Yakala</h1>
<p><b id="name"></b> seni Yakala'ya davet etti!<br>Birbirinize not gönderebilirsiniz.</p>
<button onclick="go()">📋 Kodu Kopyala + Uygulamayı Aç</button>
<p style="font-size:.8rem;margin-top:16px">Davet kodu: <b id="code"></b><br>Uygulama yoksa arkadaşından APK'yı iste.</p>
</div>
<script>
const q=new URLSearchParams(location.search);
const code=q.get('code')||'',name=q.get('name')||'Bir arkadaşın';
document.getElementById('code').textContent=code;
document.getElementById('name').textContent=name;
function go(){
  if(navigator.clipboard)navigator.clipboard.writeText('YAKALA KOD: '+code);
  location.href='yakala://invite?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(name);
}
</script>
</body>
</html>
